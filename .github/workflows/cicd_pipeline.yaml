name: CI/CD Dev Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    # Pull all four dev-environment variables and your SP secrets
    env:
      AZURE_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      AZURE_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      AZURE_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      APP_CONFIG_ENDPOINT:   ${{ vars.APP_CONFIG_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI (latest)
        uses: Azure/setup-azd@v2

      - name: Verify azd version
        run: |
          azd version 

      - name: Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure authentication and App Config access
        run: |
          echo "Verifying Azure CLI authentication..."
          az account show
          echo "Checking access to App Configuration..."
          # Extract the config name from the endpoint
          CONFIG_NAME=$(echo "$APP_CONFIG_ENDPOINT" | sed 's|https://||' | sed 's|\.azconfig\.io||')
          echo "Config name: $CONFIG_NAME"
          # Test if we can list keys (this will verify authentication and permissions)
          az appconfig kv list --name "$CONFIG_NAME" --auth-mode login --top 1 || echo "App Config access test failed, but continuing..."

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Deploy to Azure
        env:
          # Ensure Azure credentials are available for any Python components
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          APP_CONFIG_ENDPOINT: ${{ vars.APP_CONFIG_ENDPOINT }}
        run: |
          ./scripts/deploy.sh